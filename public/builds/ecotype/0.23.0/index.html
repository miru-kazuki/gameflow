<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoType v0.23.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a2e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
      overflow: hidden;
    }
    canvas { border-radius: 8px; cursor: pointer; }
    .hud { margin-top: 12px; text-align: center; }
    .hud h2 { color: #4ade80; font-size: 14px; }
    .hud p { color: #86efac; font-size: 12px; margin-top: 4px; }
    .badge {
      display: inline-block;
      background: #166534;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="640" height="360"></canvas>
  <div class="hud">
    <h2>EcoType v0.23.0 — Trash Sorting</h2>
    <p>Click items to sort: Organic | Plastic | Metal</p>
    <span class="badge">Unity WebGL Build</span>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let score = 0;
    const items = [
      { x: 100, y: 150, type: 'organic', color: '#4ade80', label: '🍎' },
      { x: 320, y: 180, type: 'plastic', color: '#60a5fa', label: '🥤' },
      { x: 500, y: 140, type: 'metal', color: '#a78bfa', label: '🔩' },
    ];
    const bins = [
      { x: 80, y: 280, type: 'organic', color: '#166534', label: 'Organic' },
      { x: 280, y: 280, type: 'plastic', color: '#1e40af', label: 'Plastic' },
      { x: 480, y: 280, type: 'metal', color: '#5b21b6', label: 'Metal' },
    ];
    let dragging = null;

    function draw() {
      ctx.fillStyle = '#0f1f0f';
      ctx.fillRect(0, 0, 640, 360);
      ctx.fillStyle = '#fff';
      ctx.font = '16px system-ui';
      ctx.fillText('Score: ' + score, 20, 30);
      bins.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, 80, 60);
        ctx.fillStyle = '#fff';
        ctx.font = '11px system-ui';
        ctx.fillText(b.label, b.x + 10, b.y + 35);
      });
      items.forEach(item => {
        ctx.fillStyle = item.color;
        ctx.beginPath();
        ctx.arc(item.x, item.y, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '24px serif';
        ctx.fillText(item.label, item.x - 12, item.y + 8);
      });
    }

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (640 / rect.width);
      const my = (e.clientY - rect.top) * (360 / rect.height);
      items.forEach(item => {
        const dist = Math.hypot(mx - item.x, my - item.y);
        if (dist < 30) {
          bins.forEach(bin => {
            if (Math.abs(mx - (bin.x + 40)) < 60 && Math.abs(my - (bin.y + 30)) < 40) {
              if (item.type === bin.type) score += 10;
              else score -= 5;
            }
          });
        }
      });
    });

    setInterval(draw, 1000 / 30);
    draw();
  </script>
</body>
</html>
